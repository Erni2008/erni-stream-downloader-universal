name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build EXE
        shell: pwsh
        run: .\build_windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERNI-Stream-Downloader-Windows
          path: dist/ERNI Stream Downloader.exe

  build-macos:
    name: Build macOS APP
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bundled media tools
        run: brew install ffmpeg deno

      - name: Build app
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/ERNI Stream Downloader.app" "ERNI Stream Downloader macOS.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERNI-Stream-Downloader-macOS
          path: ERNI Stream Downloader macOS.zip
